[package]
name = "crownos-files"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bitflags = "2.13"
compact_str = "0.10"
foldhash = "0.2"
hashbrown = "0.17"
indexmap = "2.14"
memchr = "2.8"
notify = { version = "8.2", default-features = false }
rayon = "1.12"
rustix = { version = "1.1", features = ["fs", "event"] }
thiserror = "2"
tokio = { version = "1.54", default-features = false, features = [
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }

[dev-dependencies]
tempfile = "3.27"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
