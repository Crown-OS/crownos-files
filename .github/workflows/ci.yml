# Formats, builds, lints and tests on every push and pull request. Logic lives
# in Crown-OS/.github.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: Crown-OS/.github/.github/workflows/rust.yml@main
    with:
      packages: glib2 cairo poppler-glib gstreamer gst-plugins-base-libs gst-plugins-base libjpeg-turbo shared-mime-info
